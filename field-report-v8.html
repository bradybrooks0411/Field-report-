<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Partners Construction — Field Report</title>

<style>
  :root {
    --y:#F5C500;--bk:#0A0A0A;--dk:#141414;--mid:#1E1E1E;--bd:#2A2A2A;
    --tx:#E0E0E0;--mu:#555;--red:#FF4444;--grn:#22C55E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--bk);color:var(--tx);font-family:'IBM Plex Sans',sans-serif;padding-bottom:120px;}

  /* HEADER */
  header{background:var(--bk);border-bottom:2px solid #F5C500;padding:10px 16px;position:sticky;top:0;z-index:200;display:flex;justify-content:space-between;align-items:center;}
  .logo-img{height:38px;width:auto;object-fit:contain;}
  .hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  .hdr-btn{background:var(--mid);border:1px solid var(--bd);color:var(--tx);padding:5px 11px;font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:12px;letter-spacing:2px;cursor:pointer;border-radius:3px;white-space:nowrap;}
  .hdr-btn.blue{background:#F5C500;border-color:#F5C500;color:var(--bk);}

  /* BARS */
  .job-bar{background:var(--dk);border-bottom:1px solid var(--bd);padding:6px 16px;font-family:'Courier New', Courier, monospace;font-size:10px;color:var(--mu);letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
  .job-bar span{color:#F5C500;}
  .date-bar{font-family:'Courier New', Courier, monospace;font-size:10px;color:var(--mu);letter-spacing:1px;}
  .save-bar{background:var(--dk);border-bottom:1px solid var(--bd);padding:5px 16px;font-family:'Courier New', Courier, monospace;font-size:9px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
  .save-ind{color:var(--mu);transition:color 0.3s;}
  .save-ind.saved{color:var(--grn);}
  .backup-nudge{color:var(--y);font-size:9px;cursor:pointer;letter-spacing:1px;}

  /* TABS */
  .tabs{display:flex;border-bottom:1px solid var(--bd);background:var(--dk);position:sticky;top:61px;z-index:190;overflow-x:auto;}
  .tab{flex:1;min-width:70px;padding:10px 4px;font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:12px;letter-spacing:1px;text-align:center;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap;}
  .tab.active{color:#F5C500;border-bottom-color:#F5C500;}

  /* SECTIONS */
  .section{padding:16px;border-bottom:1px solid var(--bd);}
  .sec-label{font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:12px;letter-spacing:3px;color:#F5C500;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .sec-label::after{content:'';flex:1;height:1px;background:var(--bd);}

  /* INPUTS */
  textarea,input[type="text"],input[type="number"],input[type="date"],select{
    background:var(--mid);border:1px solid var(--bd);color:var(--tx);
    padding:11px 12px;font-family:'IBM Plex Sans',sans-serif;font-size:16px;
    border-radius:5px;outline:none;width:100%;-webkit-appearance:none;
  }
  textarea{resize:vertical;min-height:80px;line-height:1.55;}
  select{appearance:none;cursor:pointer;}
  input:focus,textarea:focus,select:focus{border-color:#F5C500;}
  input::placeholder,textarea::placeholder{color:var(--mu);}
  input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.5);}

  /* CREW */
  .crew-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .crew-row input[type="text"]{flex:1;}
  .crew-row input[type="number"]{width:64px;text-align:center;color:#F5C500;font-family:'Courier New', Courier, monospace;font-weight:500;}
  .rm-btn{background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer;padding:4px 8px;line-height:1;flex-shrink:0;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;}
  .mp-total{font-family:'Courier New', Courier, monospace;font-size:11px;color:var(--mu);margin-top:6px;letter-spacing:1px;}
  .mp-total span{color:#F5C500;font-weight:500;}
  .add-btn{background:none;border:1px dashed var(--bd);color:var(--mu);padding:11px 16px;font-family:'Courier New', Courier, monospace;font-size:11px;letter-spacing:1px;cursor:pointer;border-radius:5px;width:100%;margin-top:8px;min-height:44px;}

  /* ISSUES */
  .issue-row{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start;}
  .issue-type{width:96px;flex-shrink:0;font-size:13px;}
  .issue-row textarea{flex:1;min-height:60px;}

  /* WEATHER */
  .wx-grid{display:flex;gap:8px;flex-wrap:wrap;}
  .wx-grid select{flex:1;min-width:130px;}
  .wx-temp{max-width:88px;}
  .wx-notes{flex:2;min-width:120px;}

  /* PHOTOS */
  .photo-wrap{display:flex;align-items:center;gap:18px;}
  .photo-num{font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:64px;color:#F5C500;line-height:1;min-width:76px;}
  .photo-btns{display:flex;flex-direction:column;gap:8px;}
  .cnt-btn{background:var(--mid);border:1px solid var(--bd);color:var(--tx);width:48px;height:48px;font-size:24px;cursor:pointer;border-radius:5px;display:flex;align-items:center;justify-content:center;}
  .photo-meta{font-size:12px;color:var(--mu);font-family:'Courier New', Courier, monospace;margin-top:4px;letter-spacing:1px;}

  /* LEARNED */
  .learned-row{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start;}
  .ln{font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:30px;color:#F5C500;line-height:1.3;width:22px;flex-shrink:0;}
  .learned-row textarea{flex:1;min-height:64px;}

  /* WIN */
  .win-wrap{position:relative;}
  .win-wrap textarea{padding-left:36px;}
  .win-icon{position:absolute;left:11px;top:12px;font-size:16px;pointer-events:none;}

  /* PUNCH */
  .punch-row{display:flex;gap:10px;margin-bottom:8px;align-items:center;}
  .punch-check{width:32px;height:32px;min-width:32px;border-radius:4px;border:2px solid var(--bd);background:var(--mid);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .punch-check.done{background:var(--grn);border-color:var(--grn);color:var(--bk);}
  .punch-row input[type="text"]{flex:1;}
  .punch-row.done-item input{text-decoration:line-through;opacity:0.4;}
  .punch-stats{font-family:'Courier New', Courier, monospace;font-size:10px;color:var(--mu);margin-bottom:10px;letter-spacing:1px;}
  .punch-stats span{color:var(--grn);}

  /* SCHEDULE */
  .milestone-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap;}
  .ms-name{flex:1;min-width:140px;}
  .ms-date{width:150px;flex-shrink:0;}
  .ms-badge{font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:13px;letter-spacing:1px;padding:6px 10px;border-radius:4px;flex-shrink:0;white-space:nowrap;min-width:80px;text-align:center;}
  .ms-badge.overdue{background:var(--red);color:var(--bk);}
  .ms-badge.today{background:var(--y);color:var(--bk);}
  .ms-badge.soon{background:#F5C500;color:var(--bk);}
  .ms-badge.ok{background:var(--mid);border:1px solid var(--bd);color:var(--mu);}
  .ms-badge.done{background:var(--grn);color:var(--bk);}
  .ms-check{width:32px;height:32px;min-width:32px;border-radius:4px;border:2px solid var(--bd);background:var(--mid);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .ms-check.done{background:var(--grn);border-color:var(--grn);color:var(--bk);}
  .schedule-summary{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .ss-box{background:var(--mid);border:1px solid var(--bd);border-radius:5px;padding:10px 14px;flex:1;min-width:80px;text-align:center;}
  .ss-num{font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:28px;line-height:1;}
  .ss-lbl{font-family:'Courier New', Courier, monospace;font-size:9px;color:var(--mu);letter-spacing:1px;margin-top:2px;}
  .ss-box.red .ss-num{color:var(--red);}
  .ss-box.grn .ss-num{color:var(--grn);}
  .ss-box.blue .ss-num{color:#F5C500;}

  /* SUBS */
  .sub-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .sub-row input[type="text"]{flex:1;}
  .sub-phone{max-width:150px;}
  .call-btn{background:var(--grn);border:none;color:var(--bk);padding:11px 14px;font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;border-radius:5px;flex-shrink:0;min-width:64px;min-height:44px;text-decoration:none;display:flex;align-items:center;justify-content:center;}
  .call-btn-off{background:var(--mid);border:1px solid var(--bd);color:var(--mu);padding:11px 14px;font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:13px;letter-spacing:1px;border-radius:5px;flex-shrink:0;min-width:64px;min-height:44px;display:flex;align-items:center;justify-content:center;}

  /* SUBMIT */
  .submit-area{padding:16px;display:flex;flex-direction:column;gap:10px;}
  .submit-btn{width:100%;background:#F5C500;border:none;color:var(--bk);padding:17px;font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:20px;letter-spacing:3px;cursor:pointer;border-radius:5px;min-height:56px;}
  .share-btn{width:100%;background:var(--mid);border:1px solid var(--bd);color:var(--tx);padding:14px;font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;border-radius:5px;min-height:50px;}

  /* HISTORY */
  .hist-wrap{padding:16px;}
  .hist-item{background:var(--mid);border:1px solid var(--bd);padding:13px 16px;border-radius:5px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .hist-item.today{border-color:#F5C500;}
  .hist-date{font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:15px;letter-spacing:2px;}
  .hist-item.today .hist-date{color:#F5C500;}
  .hist-meta{font-family:'Courier New', Courier, monospace;font-size:10px;color:var(--mu);margin-top:3px;}
  .del-btn{background:none;border:1px solid var(--red);color:var(--red);padding:6px 12px;font-family:'Courier New', Courier, monospace;font-size:10px;cursor:pointer;border-radius:3px;letter-spacing:1px;min-height:36px;}

  /* READ-ONLY */
  .ro-sec{padding:14px 16px;border-bottom:1px solid var(--bd);}
  .ro-lbl{font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:12px;letter-spacing:3px;color:#F5C500;margin-bottom:6px;}
  .ro-val{font-size:14px;color:var(--tx);line-height:1.6;white-space:pre-wrap;}
  .ro-mono{font-family:'Courier New', Courier, monospace;font-size:13px;margin-bottom:3px;}
  .itag{background:var(--bd);padding:2px 7px;border-radius:3px;font-family:'Courier New', Courier, monospace;font-size:10px;margin-right:7px;letter-spacing:1px;display:inline-block;}
  .viewing-bar{padding:9px 16px;background:var(--dk);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-family:'Courier New', Courier, monospace;font-size:10px;color:var(--mu);letter-spacing:1px;}
  .viewing-bar em{color:#F5C500;font-style:normal;}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:500;display:flex;align-items:flex-end;}
  .modal{background:var(--dk);border-top:2px solid #F5C500;padding:22px 18px 40px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal h2{font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:20px;color:#F5C500;letter-spacing:3px;margin-bottom:14px;}
  .modal pre{font-family:'Courier New', Courier, monospace;font-size:12px;color:var(--tx);line-height:1.6;white-space:pre-wrap;background:var(--mid);padding:14px;border-radius:5px;margin-bottom:14px;}
  .modal-btns{display:flex;gap:10px;}
  .modal-copy{flex:1;background:#F5C500;border:none;color:var(--bk);padding:14px;font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;border-radius:5px;}
  .modal-close{background:var(--mid);border:1px solid var(--bd);color:var(--tx);padding:14px 20px;font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;border-radius:5px;}

  /* TOAST */
  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);background:#F5C500;color:var(--bk);padding:11px 22px;font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:15px;letter-spacing:2px;border-radius:4px;z-index:400;white-space:nowrap;transition:transform 0.25s ease;pointer-events:none;}
  #toast.show{transform:translateX(-50%) translateY(0);}

  .empty-msg{color:var(--mu);font-family:'Courier New', Courier, monospace;font-size:12px;letter-spacing:1px;padding:16px 0;}
  .section-note{font-family:'Courier New', Courier, monospace;font-size:10px;color:var(--mu);margin-bottom:10px;letter-spacing:1px;}
</style>
</head>

// ════════════ STATE ════════════
let view='today', activeTab='log', viewingKey=null;
let autoSaveTimer=null, saveFlashTimer=null, modalContent=null;
let crewId=200, issueId=200, punchId=200, subId=200, msId=200;

const DEFAULT_CREWS=[
  {id:1,sub:'Steel',count:''},{id:2,sub:'Electrical',count:''},
  {id:3,sub:'Plumbing',count:''},{id:4,sub:'HVAC',count:''}
];

function emptyReport(){
  return{crews:JSON.parse(JSON.stringify(DEFAULT_CREWS)),workDone:'',issues:[],
    weatherCondition:'',weatherTemp:'',weatherNotes:'',photoCount:0,
    learn1:'',learn2:'',learn3:'',win:'',tmrwPlan:''};
}

function todayKey(){return new Date().toISOString().split('T')[0];}
function formatDate(key){
  const [y,m,d]=key.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).toUpperCase();
}

let report=emptyReport();
try{const s=localStorage.getItem('report:'+todayKey());if(s)report=JSON.parse(s);}catch(e){}

let punches=[];
try{const s=localStorage.getItem('punchlist');if(s)punches=JSON.parse(s);}catch(e){}

let subs=[];
try{const s=localStorage.getItem('subcontacts');if(s)subs=JSON.parse(s);}catch(e){}

let milestones=[];
try{const s=localStorage.getItem('milestones');if(s)milestones=JSON.parse(s);}catch(e){}

// Init default milestones if empty
if(!milestones.length){
  const defaults=[
    {id:1,name:'Electrical Final Inspection',date:'2025-07-01',done:false},
    {id:2,name:'HVAC Inspection',date:'2025-07-07',done:false},
    {id:3,name:'Drywall Complete',date:'2025-07-14',done:false},
    {id:4,name:'Electrical Devices Installed',date:'2025-07-18',done:false},
    {id:5,name:'Punch List Complete',date:'2025-07-25',done:false},
    {id:6,name:'Substantial Completion',date:'2025-08-01',done:false},
  ];
  milestones=defaults;
  localStorage.setItem('milestones',JSON.stringify(milestones));
}

if(subs.length) subId=Math.max(subId,...subs.map(s=>s.id||0))+1;
if(punches.length) punchId=Math.max(punchId,...punches.map(p=>p.id||0))+1;
if(milestones.length) msId=Math.max(msId,...milestones.map(m=>m.id||0))+1;

function getAllReportKeys(){return Object.keys(localStorage).filter(k=>k.startsWith('report:')).sort().reverse();}

// ════════════ SAVE ════════════
function saveReport(showMsg){
  localStorage.setItem('report:'+todayKey(),JSON.stringify(report));
  flashSaved();
  if(showMsg) showToast('REPORT LOCKED IN ✓');
}
function savePunches(){localStorage.setItem('punchlist',JSON.stringify(punches));}
function saveSubs(){localStorage.setItem('subcontacts',JSON.stringify(subs));}
function saveMilestones(){localStorage.setItem('milestones',JSON.stringify(milestones));}
function scheduleAutoSave(){clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>saveReport(false),700);}
function flashSaved(){
  const el=document.getElementById('save-ind');if(!el)return;
  el.textContent='SAVED ✓';el.classList.add('saved');
  clearTimeout(saveFlashTimer);
  saveFlashTimer=setTimeout(()=>{el.textContent='AUTO-SAVING';el.classList.remove('saved');},1800);
}

// ════════════ BACKUP ════════════
function checkBackupNudge(){
  const last=localStorage.getItem('lastBackup');
  if(!last)return true;
  return (Date.now()-parseInt(last))/86400000>=7;
}
function doBackup(){
  const keys=getAllReportKeys();
  let out='PARTNERS CONSTRUCTION — FIELD REPORT BACKUP\nExported: '+new Date().toLocaleString().toUpperCase()+'\n'+'='.repeat(50)+'\n\n';
  keys.forEach(key=>{
    try{const r=JSON.parse(localStorage.getItem(key));out+=buildTextReport(r,key.replace('report:',''))+'\n\n'+'─'.repeat(40)+'\n\n';}catch(e){}
  });
  const blob=new Blob([out],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='field-reports-backup-'+todayKey()+'.txt';
  a.click();
  localStorage.setItem('lastBackup',Date.now().toString());
  showToast('BACKUP SAVED ✓');
  render();
}

// ════════════ SHARE ════════════
function buildTextReport(r,dateStr){
  const total=(r.crews||[]).reduce((s,c)=>s+(parseInt(c.count)||0),0);
  const lines=['PARTNERS CONSTRUCTION — FIELD REPORT','Date: '+formatDate(dateStr),'Job: Ju Young',''];
  lines.push('MANPOWER ('+total+' on site)');
  (r.crews||[]).forEach(c=>{if(c.sub||c.count)lines.push('  '+(c.sub||'(unlabeled)')+': '+(c.count||0));});
  lines.push('');
  if(r.workDone){lines.push('WORK COMPLETED');lines.push(r.workDone);lines.push('');}
  if((r.issues||[]).length){lines.push('ISSUES & DELAYS');(r.issues||[]).forEach(i=>lines.push('  ['+i.type+'] '+i.desc));lines.push('');}
  const wx=[r.weatherCondition,r.weatherTemp?r.weatherTemp+'°F':'',r.weatherNotes].filter(Boolean).join(' · ');
  if(wx){lines.push('WEATHER: '+wx);lines.push('');}
  lines.push('PHOTOS: '+(r.photoCount||0));
  if(r.win){lines.push('');lines.push('WIN OF THE DAY: '+r.win);}
  if(r.tmrwPlan){lines.push('');lines.push("TOMORROW'S PLAN");lines.push(r.tmrwPlan);}
  return lines.join('\n');
}
function showShareModal(){modalContent=buildTextReport(report,todayKey());render();}
function copyModal(){
  navigator.clipboard.writeText(modalContent).then(()=>{showToast('COPIED ✓');modalContent=null;render();})
  .catch(()=>showToast('SELECT AND COPY TEXT ABOVE'));
}

// ════════════ SCHEDULE HELPERS ════════════
function daysUntil(dateStr){
  if(!dateStr)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const target=new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function msBadge(m){
  if(m.done)return{cls:'done',label:'DONE ✓'};
  const d=daysUntil(m.date);
  if(d===null)return{cls:'ok',label:'NO DATE'};
  if(d<0)return{cls:'overdue',label:'OVERDUE '+Math.abs(d)+'D'};
  if(d===0)return{cls:'today',label:'TODAY'};
  if(d<=7)return{cls:'soon',label:'IN '+d+'D'};
  return{cls:'ok',label:'IN '+d+'D'};
}

// ════════════ TOAST ════════════
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

// ════════════ ESCAPE ════════════
function eh(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ════════════ RENDER ════════════
function render(){
  const allKeys=getAllReportKeys();
  const needsBackup=checkBackupNudge()&&allKeys.length>0;
  let html='';

  // Header with logo
  html+=`<header>
    <img src="data:image/jpeg;base64,${LOGO_B64}" class="logo-img" alt="Partners Construction">
    <div class="hdr-right">
      <button class="hdr-btn" onclick="toggleHistory()">${view!=='today'?'◀ TODAY':'HISTORY ('+allKeys.length+')'}</button>
      ${view==='today'?`<button class="hdr-btn blue" onclick="doBackup()">BACKUP</button>`:''}
    </div>
  </header>
  <div class="job-bar"><span>JU YOUNG</span><span class="date-bar">${formatDate(todayKey())}</span></div>`;

  // HISTORY
  if(view==='history'){
    html+=`<div class="hist-wrap"><div class="sec-label" style="font-family:Impact, 'Arial Narrow', Arial, sans-serif;font-size:12px;letter-spacing:3px;color:#F5C500;margin-bottom:12px;">Past Reports</div>`;
    if(!allKeys.length)html+=`<div class="empty-msg">NO REPORTS YET</div>`;
    allKeys.forEach(key=>{
      const ds=key.replace('report:','');const isToday=ds===todayKey();
      let meta='';
      try{const r=JSON.parse(localStorage.getItem(key));const tot=(r.crews||[]).reduce((s,c)=>s+(parseInt(c.count)||0),0);meta=tot+' WORKERS · '+(r.photoCount||0)+' PHOTOS'+(r.win?' · ⭐':' ');}catch(e){}
      html+=`<div class="hist-item ${isToday?'today':''}" onclick="${isToday?'toggleHistory()':'openReport(\''+key+'\')'}">
        <div><div class="hist-date">${isToday?'▶ ':''}${formatDate(ds)}${isToday?' (TODAY)':''}</div><div class="hist-meta">${meta}</div></div>
        ${!isToday?`<button class="del-btn" onclick="event.stopPropagation();confirmDelete('${key}')">DELETE</button>`:''}
      </div>`;
    });
    html+=`</div>`;
  }

  // READ-ONLY VIEW
  else if(view==='view'&&viewingKey){
    let r=emptyReport();try{r=JSON.parse(localStorage.getItem(viewingKey));}catch(e){}
    const tot=(r.crews||[]).reduce((s,c)=>s+(parseInt(c.count)||0),0);
    const ds=viewingKey.replace('report:','');
    html+=`<div class="viewing-bar">VIEWING: <em>${formatDate(ds)}</em><button class="del-btn" onclick="confirmDelete('${viewingKey}')">DELETE</button></div>`;
    html+=roSec('MANPOWER — '+tot+' TOTAL',(r.crews||[]).map(c=>`<div class="ro-mono">${eh(c.sub)||'(unlabeled)'}: <span style="color:#F5C500">${c.count||0}</span></div>`).join(''));
    if(r.workDone)html+=roSec('Work Completed',`<div class="ro-val">${eh(r.workDone)}</div>`);
    if((r.issues||[]).length)html+=roSec('Issues',r.issues.map(i=>`<div style="margin-bottom:6px"><span class="itag">${eh(i.type)}</span><span class="ro-val">${eh(i.desc)}</span></div>`).join(''));
    const wx=[r.weatherCondition,r.weatherTemp?r.weatherTemp+'°F':'',r.weatherNotes].filter(Boolean).join(' · ');
    if(wx)html+=roSec('Weather',`<div class="ro-val">${eh(wx)}</div>`);
    html+=roSec('Photos',`<div class="ro-val">${r.photoCount||0} photos</div>`);
    if(r.win)html+=roSec('⭐ Win of the Day',`<div class="ro-val">${eh(r.win)}</div>`);
    if(r.learn1)html+=roSec('Learned #1',`<div class="ro-val">${eh(r.learn1)}</div>`);
    if(r.learn2)html+=roSec('Learned #2',`<div class="ro-val">${eh(r.learn2)}</div>`);
    if(r.learn3)html+=roSec('Learned #3',`<div class="ro-val">${eh(r.learn3)}</div>`);
    if(r.tmrwPlan)html+=roSec("Tomorrow's Plan",`<div class="ro-val">${eh(r.tmrwPlan)}</div>`);
  }

  // TODAY
  else if(view==='today'){
    html+=`<div class="save-bar"><span id="save-ind" class="save-ind">AUTO-SAVING</span>${needsBackup?`<span class="backup-nudge" onclick="doBackup()">⚠ BACKUP DUE</span>`:''}</div>`;
    html+=`<div class="tabs">
      <button class="tab ${activeTab==='log'?'active':''}" onclick="setTab('log')">DAILY LOG</button>
      <button class="tab ${activeTab==='schedule'?'active':''}" onclick="setTab('schedule')">SCHEDULE</button>
      <button class="tab ${activeTab==='punch'?'active':''}" onclick="setTab('punch')">PUNCH LIST</button>
      <button class="tab ${activeTab==='subs'?'active':''}" onclick="setTab('subs')">SUBS</button>
    </div>`;

    // ── LOG ──
    if(activeTab==='log'){
      const total=report.crews.reduce((s,c)=>s+(parseInt(c.count)||0),0);
      html+=`<div class="section"><div class="sec-label">Manpower On Site</div>`;
      report.crews.forEach(c=>{
        html+=`<div class="crew-row">
          <input type="text" placeholder="Sub / Trade" value="${eh(c.sub)}" oninput="updCrew(${c.id},'sub',this.value)">
          <input type="number" placeholder="0" min="0" value="${eh(c.count)}" oninput="updCrew(${c.id},'count',this.value)">
          <button class="rm-btn" onclick="rmCrew(${c.id})">×</button>
        </div>`;
      });
      html+=`<div class="mp-total">TOTAL: <span>${total}</span> WORKERS</div>
        <button class="add-btn" onclick="addCrew()">+ ADD SUB / CREW</button></div>`;

      html+=`<div class="section"><div class="sec-label">Work Completed Today</div>
        <textarea rows="4" placeholder="What actually got done? Location, scope, status." oninput="updF('workDone',this.value)">${eh(report.workDone)}</textarea></div>`;

      html+=`<div class="section"><div class="sec-label">Issues & Delays</div>`;
      report.issues.forEach(iss=>{
        html+=`<div class="issue-row">
          <select class="issue-type" onchange="updIssue(${iss.id},'type',this.value)">
            ${['Delay','Safety','RFI','Material','Sub','Other'].map(t=>`<option ${iss.type===t?'selected':''}>${t}</option>`).join('')}
          </select>
          <textarea rows="2" placeholder="Describe the issue." oninput="updIssue(${iss.id},'desc',this.value)">${eh(iss.desc)}</textarea>
          <button class="rm-btn" style="margin-top:8px" onclick="rmIssue(${iss.id})">×</button>
        </div>`;
      });
      html+=`<button class="add-btn" onclick="addIssue()">+ ADD ISSUE</button></div>`;

      html+=`<div class="section"><div class="sec-label">Weather</div><div class="wx-grid">
        <select onchange="updF('weatherCondition',this.value)">
          ${['','Clear','Partly Cloudy','Overcast','Rain','Heavy Rain','Wind','Extreme Heat'].map(c=>`<option ${report.weatherCondition===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <input type="text" class="wx-temp" placeholder="Temp °F" value="${eh(report.weatherTemp)}" oninput="updF('weatherTemp',this.value)">
        <input type="text" class="wx-notes" placeholder="Notes" value="${eh(report.weatherNotes)}" oninput="updF('weatherNotes',this.value)">
      </div></div>`;

      html+=`<div class="section"><div class="sec-label">Photos Taken</div>
        <div class="photo-wrap">
          <div class="photo-num" id="pnum">${report.photoCount}</div>
          <div class="photo-btns">
            <button class="cnt-btn" onclick="chgPhotos(1)">+</button>
            <button class="cnt-btn" onclick="chgPhotos(-1)">−</button>
          </div>
          <div><div style="font-size:13px">photos documented</div><div class="photo-meta">TARGET: 10+/DAY</div></div>
        </div></div>`;

      html+=`<div class="section"><div class="sec-label">⭐ Win of the Day</div>
        <div class="win-wrap"><span class="win-icon">⭐</span>
          <textarea rows="2" placeholder="One win — big or small. You'll want this record in a year." oninput="updF('win',this.value)">${eh(report.win)}</textarea>
        </div></div>`;

      html+=`<div class="section"><div class="sec-label">What I Learned Today</div>`;
      [['learn1','Something you figured out, got wrong, or saw first time.'],
       ['learn2','A decision you made and why.'],
       ['learn3','Something to do differently tomorrow.']].forEach(([f,ph],i)=>{
        html+=`<div class="learned-row"><div class="ln">${i+1}</div>
          <textarea rows="2" placeholder="${ph}" oninput="updF('${f}',this.value)">${eh(report[f])}</textarea>
        </div>`;
      });
      html+=`</div>`;

      html+=`<div class="section"><div class="sec-label">Tomorrow's Plan</div>
        <textarea rows="4" placeholder="What needs to happen? Who do you call? What are you watching?" oninput="updF('tmrwPlan',this.value)">${eh(report.tmrwPlan)}</textarea></div>`;

      html+=`<div class="submit-area">
        <button class="submit-btn" onclick="saveReport(true)">LOCK IN REPORT</button>
        <button class="share-btn" onclick="showShareModal()">📋 COPY SUMMARY FOR PM / BOSS</button>
      </div>`;
    }

    // ── SCHEDULE ──
    else if(activeTab==='schedule'){
      const overdue=milestones.filter(m=>!m.done&&daysUntil(m.date)<0).length;
      const done=milestones.filter(m=>m.done).length;
      const upcoming=milestones.filter(m=>!m.done&&daysUntil(m.date)>=0&&daysUntil(m.date)<=7).length;

      html+=`<div class="section">
        <div class="schedule-summary">
          <div class="ss-box red"><div class="ss-num">${overdue}</div><div class="ss-lbl">OVERDUE</div></div>
          <div class="ss-box blue"><div class="ss-num">${upcoming}</div><div class="ss-lbl">THIS WEEK</div></div>
          <div class="ss-box grn"><div class="ss-num">${done}/${milestones.length}</div><div class="ss-lbl">COMPLETE</div></div>
        </div>
        <div class="sec-label">Milestones</div>
        <div class="section-note">TAP CHECK TO MARK DONE · OVERDUE = RED · THIS WEEK = BLUE</div>`;

      milestones.forEach(m=>{
        const b=msBadge(m);
        html+=`<div class="milestone-row">
          <div class="ms-check ${m.done?'done':''}" onclick="toggleMs(${m.id})">${m.done?'✓':''}</div>
          <input type="text" class="ms-name" placeholder="Milestone..." value="${eh(m.name)}" oninput="updMs(${m.id},'name',this.value)" ${m.done?'style="opacity:0.4;text-decoration:line-through"':''}>
          <input type="date" class="ms-date" value="${eh(m.date)}" onchange="updMs(${m.id},'date',this.value)">
          <div class="ms-badge ${b.cls}">${b.label}</div>
          <button class="rm-btn" onclick="rmMs(${m.id})">×</button>
        </div>`;
      });

      html+=`<button class="add-btn" onclick="addMs()">+ ADD MILESTONE</button></div>`;
    }

    // ── PUNCH ──
    else if(activeTab==='punch'){
      const done=punches.filter(p=>p.done).length;
      html+=`<div class="section"><div class="sec-label">Punch List</div>
        <div class="punch-stats">COMPLETE: <span>${done}/${punches.length}</span></div><br>`;
      punches.forEach(p=>{
        html+=`<div class="punch-row ${p.done?'done-item':''}">
          <div class="punch-check ${p.done?'done':''}" onclick="togglePunch(${p.id})">${p.done?'✓':''}</div>
          <input type="text" placeholder="Punch item..." value="${eh(p.text)}" oninput="updPunch(${p.id},this.value)" ${p.done?'disabled':''}>
          <button class="rm-btn" onclick="rmPunch(${p.id})">×</button>
        </div>`;
      });
      html+=`<button class="add-btn" onclick="addPunch()">+ ADD PUNCH ITEM</button></div>`;
    }

    // ── SUBS ──
    else if(activeTab==='subs'){
      html+=`<div class="section"><div class="sec-label">Sub Contacts</div>`;
      subs.forEach(s=>{
        html+=`<div class="sub-row">
          <input type="text" placeholder="Company / Name" value="${eh(s.name)}" oninput="updSub(${s.id},'name',this.value)">
          <input type="text" class="sub-phone" placeholder="Phone" value="${eh(s.phone)}" oninput="updSub(${s.id},'phone',this.value)">
          ${s.phone?`<a href="tel:${eh(s.phone)}" class="call-btn">CALL</a>`:`<div class="call-btn-off">CALL</div>`}
          <button class="rm-btn" onclick="rmSub(${s.id})">×</button>
        </div>`;
      });
      html+=`<button class="add-btn" onclick="addSub()">+ ADD CONTACT</button></div>`;
    }
  }

  document.getElementById('app').innerHTML=html;

  if(modalContent){
    document.getElementById('app').insertAdjacentHTML('beforeend',`
      <div class="modal-bg" onclick="closeModal(event)">
        <div class="modal">
          <h2>COPY SUMMARY</h2>
          <pre>${eh(modalContent)}</pre>
          <div class="modal-btns">
            <button class="modal-copy" onclick="copyModal()">COPY TO CLIPBOARD</button>
            <button class="modal-close" onclick="modalContent=null;render()">CLOSE</button>
          </div>
        </div>
      </div>`);
  }
}

function roSec(label,content){return`<div class="ro-sec"><div class="ro-lbl">${label}</div>${content}</div>`;}
function closeModal(e){if(e.target.classList.contains('modal-bg')){modalContent=null;render();}}

// ════════════ ACTIONS ════════════
function toggleHistory(){view=(view!=='today')?'today':'history';viewingKey=null;render();}
function openReport(key){viewingKey=key;view='view';render();}
function setTab(t){activeTab=t;render();}
function confirmDelete(key){if(!confirm('Delete this report? Cannot be undone.'))return;localStorage.removeItem(key);if(view==='view')view='history';showToast('DELETED');render();}

function updF(f,v){report[f]=v;scheduleAutoSave();}
function addCrew(){crewId++;report.crews.push({id:crewId,sub:'',count:''});saveReport(false);render();}
function rmCrew(id){report.crews=report.crews.filter(c=>c.id!==id);saveReport(false);render();}
function updCrew(id,f,v){const c=report.crews.find(c=>c.id===id);if(c)c[f]=v;scheduleAutoSave();if(f==='count'){const tot=report.crews.reduce((s,c)=>s+(parseInt(c.count)||0),0);const el=document.querySelector('.mp-total span');if(el)el.textContent=tot;}}

function addIssue(){issueId++;report.issues.push({id:issueId,type:'Delay',desc:''});saveReport(false);render();}
function rmIssue(id){report.issues=report.issues.filter(i=>i.id!==id);saveReport(false);render();}
function updIssue(id,f,v){const i=report.issues.find(i=>i.id===id);if(i)i[f]=v;scheduleAutoSave();}

function chgPhotos(d){report.photoCount=Math.max(0,(report.photoCount||0)+d);saveReport(false);const el=document.getElementById('pnum');if(el)el.textContent=report.photoCount;}

function addPunch(){punchId++;punches.push({id:punchId,text:'',done:false});savePunches();render();}
function rmPunch(id){punches=punches.filter(p=>p.id!==id);savePunches();render();}
function togglePunch(id){const p=punches.find(p=>p.id===id);if(p)p.done=!p.done;savePunches();render();}
function updPunch(id,v){const p=punches.find(p=>p.id===id);if(p)p.text=v;savePunches();}

function addMs(){msId++;milestones.push({id:msId,name:'',date:'',done:false});saveMilestones();render();}
function rmMs(id){milestones=milestones.filter(m=>m.id!==id);saveMilestones();render();}
function toggleMs(id){const m=milestones.find(m=>m.id===id);if(m)m.done=!m.done;saveMilestones();render();}
function updMs(id,f,v){const m=milestones.find(m=>m.id===id);if(m)m[f]=v;saveMilestones();}

function addSub(){subId++;subs.push({id:subId,name:'',phone:''});saveSubs();render();}
function rmSub(id){subs=subs.filter(s=>s.id!==id);saveSubs();render();}
function updSub(id,f,v){const s=subs.find(s=>s.id===id);if(s)s[f]=v;saveSubs();}

render();
</script>
